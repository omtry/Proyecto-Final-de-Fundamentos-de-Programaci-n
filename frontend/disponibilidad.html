<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bookey - Disponibilidad de Salas</title>
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/disponibilidad.css">
</head>

<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <a href="/" class="logo">Bookey</a>
            <div class="nav-links">
                <a href="/" class="nav-link">Principal</a>
                <a href="/rooms" class="nav-link">Salas</a>
                <a href="/disponibilidad" class="nav-link active">Disponibilidad</a>
                <a href="/profile" class="nav-link" id="profileLink" style="display: none;">Perfil</a>
                <a href="/about" class="nav-link">About us</a>
            </div>
        </div>

        <!-- Hero Section -->
        <div class="hero">
            <h1 class="hero-title">Disponibilidad de Salas</h1>
            <p class="hero-subtitle">Consulta el estado y horarios de todas las salas en tiempo real</p>
        </div>

        <!-- Filters -->
        <div class="filters">
            <div class="filter-group">
                <label for="fecha" class="filter-label">Fecha:</label>
                <input type="date" id="fecha" class="filter-input" value="">
            </div>
            <button onclick="cargarDisponibilidad()" class="btn">Actualizar</button>
        </div>

        <!-- Availability Table -->
        <div class="availability-table">
            <div class="table-header">
                <div>Sala</div>
                <div>Estado</div>
                <div>Reserva Actual</div>
                <div>Próxima Reserva</div>
                <div>Horarios Ocupados</div>
            </div>
            <div id="disponibilidadContainer" class="loading">
                Cargando disponibilidad...
            </div>
        </div>
    </div>

    <!-- Include Auth Script -->
    <script src="/js/auth.js"></script>
    <!-- Include API Script -->
    <script src="/js/api.js"></script>

    <script>
        // Establecer fecha actual por defecto
        document.getElementById('fecha').valueAsDate = new Date();

        // Cargar disponibilidad
        async function cargarDisponibilidad() {
            const container = document.getElementById('disponibilidadContainer');
            const fecha = document.getElementById('fecha').value || new Date().toISOString().split('T')[0];

            container.innerHTML = '<div class="loading">Cargando disponibilidad...</div>';

            try {
                const disponibilidad = await window.loadDisponibilidad(fecha);

                if (disponibilidad && disponibilidad.length > 0) {
                    container.innerHTML = disponibilidad.map(item => {
                        const horariosOcupados = item.horariosOcupados || [];

                        return `
                            <div class="table-row">
                                <div class="sala-name">
                                    <strong>${item.sala.nombre}</strong><br>
                                    <span style="font-size: 0.85rem; color: var(--text-light);">${item.sala.tipo} • Capacidad: ${item.sala.capacidad}</span>
                                </div>
                                <div>
                                    <span class="status-badge ${item.ocupada ? 'ocupada' : 'disponible'}">
                                        ${item.ocupada ? 'Ocupada' : 'Disponible'}
                                    </span>
                                </div>
                                <div class="reserva-info">
                                    ${item.reservaActual ? `
                                        <strong>${item.reservaActual.horario} - ${item.reservaActual.horaFin}</strong><br>
                                        ${item.reservaActual.proposito}
                                    ` : 'Ninguna'}
                                </div>
                                <div class="reserva-info">
                                    ${item.proximaReserva ? `
                                        <strong>${item.proximaReserva.horario} - ${item.proximaReserva.horaFin}</strong><br>
                                        ${item.proximaReserva.proposito}
                                    ` : 'Ninguna'}
                                </div>
                                <div>
                                    ${horariosOcupados.length > 0 ? `
                                        <div class="horarios-list">
                                            ${horariosOcupados.map(h => `
                                                <span class="horario-badge">${h.inicio} - ${h.fin}</span>
                                            `).join('')}
                                        </div>
                                    ` : '<span style="color: var(--text-light);">Sin reservas</span>'}
                                </div>
                            </div>
                        `;
                    }).join('');
                } else {
                    container.innerHTML = '<div class="loading">No hay datos de disponibilidad disponibles.</div>';
                }
            } catch (error) {
                console.error('Error loading disponibilidad:', error);
                container.innerHTML = `
                    <div class="loading" style="color: var(--danger);">
                        Error al cargar la disponibilidad. Por favor, intenta más tarde.
                    </div>
                `;
            }
        }

        // Cargar al iniciar
        document.addEventListener('DOMContentLoaded', function () {
            setTimeout(() => {
                // Actualizar UI de autenticación
                if (window.auth) {
                    window.auth.updateUI();
                }
                cargarDisponibilidad();
            }, 1000);
        });

        // Actualizar al cambiar fecha
        document.getElementById('fecha').addEventListener('change', cargarDisponibilidad);
    </script>
</body>

</html>
