<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bookey - Perfil de Usuario</title>
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/profile.css">
</head>

<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <a href="/" class="logo">Bookey</a>
            <div class="nav-links">
                <a href="/" class="nav-link">Principal</a>
                <a href="/rooms" class="nav-link">Salas</a>
                <a href="/profile" class="nav-link active">Perfil</a>
                <a href="/about" class="nav-link">About us</a>
                <div id="userInfo"></div>
            </div>
        </div>

        <!-- Profile Content -->
        <div class="profile-container">
            <div class="profile-card">
                <div id="profileAvatar" class="profile-avatar">U</div>
                <h1 id="profileName" class="profile-name">Cargando perfil...</h1>
                <p id="profileEmail" class="profile-email">Obteniendo datos del usuario...</p>

                <div class="info-item">
                    <span class="info-label">Nombre:</span>
                    <span id="infoName" class="info-value">Obteniendo...</span>
                </div>

                <div class="info-item">
                    <span class="info-label">Email:</span>
                    <span id="infoEmail" class="info-value">Obteniendo...</span>
                </div>

                <!-- Sección de Reserva Activa -->
                <div id="reservaActivaSection"
                    style="margin-top: 2rem; padding-top: 2rem; border-top: 1px solid var(--border); display: none;">
                    <h3 style="color: var(--primary); margin-bottom: 1rem;">Tu Reserva Actual</h3>
                    <div id="reservaActivaContent"
                        style="background-color: var(--primary-light); padding: 1rem; border-radius: var(--radius);">
                    </div>
                </div>

                <div class="btn-group">
                    <a href="/rooms" class="btn">Ver Salas</a>
                    <button onclick="window.auth.logout()" class="btn btn-danger">Cerrar Sesión</button>
                </div>
            </div>
        </div>
    </div>

    <script src="/js/auth.js"></script>
    <script src="/js/api.js"></script>
    <script>
        // Update profile information
        function updateProfileInfo() {
            console.log('updateProfileInfo called');

            // Wait for auth to be available
            if (!window.auth) {
                console.log('Auth not available yet, retrying...');
                setTimeout(updateProfileInfo, 500);
                return;
            }

            const user = window.auth.getCurrentUser();
            console.log('Current user:', user);

            if (user) {
                // Get real user data
                const displayName = user.displayName || user.email.split('@')[0];
                const email = user.email;

                console.log('Updating profile with:', { displayName, email });

                // Update avatar with user's initial
                const avatar = document.getElementById('profileAvatar');
                if (avatar) {
                    avatar.textContent = displayName.charAt(0).toUpperCase();
                }

                // Update header info
                const profileNameEl = document.getElementById('profileName');
                const profileEmailEl = document.getElementById('profileEmail');
                if (profileNameEl) profileNameEl.textContent = displayName;
                if (profileEmailEl) profileEmailEl.textContent = email;

                // Update info with real data
                const infoNameEl = document.getElementById('infoName');
                const infoEmailEl = document.getElementById('infoEmail');
                if (infoNameEl) infoNameEl.textContent = displayName;
                if (infoEmailEl) infoEmailEl.textContent = email;

                console.log('Profile updated successfully');

                // Cargar reserva activa
                loadReservaActiva(user.uid);
            } else {
                // Redirect to login if not authenticated
                console.log('User not authenticated, redirecting to login');
                window.location.href = '/login';
            }
        }

        // Cargar reserva activa
        async function loadReservaActiva(userId) {
            try {
                const response = await window.api.getReservasUsuario(userId);
                if (response.success && response.data.length > 0) {
                    const reservaActiva = response.data.find(r => r.estado === 'confirmada');

                    if (reservaActiva) {
                        displayReservaActiva(reservaActiva);
                    } else {
                        document.getElementById('reservaActivaSection').style.display = 'none';
                    }
                } else {
                    document.getElementById('reservaActivaSection').style.display = 'none';
                }
            } catch (error) {
                console.error('Error loading reserva activa:', error);
                document.getElementById('reservaActivaSection').style.display = 'none';
            }
        }

        // Mostrar reserva activa
        function displayReservaActiva(reserva) {
            const section = document.getElementById('reservaActivaSection');
            const content = document.getElementById('reservaActivaContent');

            if (!section || !content) return;

            // Calcular hora de finalización
            const [startHour, startMinute] = reserva.horario.split(':').map(Number);
            const endHour = startHour + reserva.duracion;
            const endTimeStr = `${endHour}:${String(startMinute).padStart(2, '0')}`;

            // Calcular tiempo hasta que termine la reserva
            const reservaDate = new Date(`${reserva.fecha}T${reserva.horario}:00`);
            const endDate = new Date(`${reserva.fecha}T${endTimeStr}:00`);
            const now = new Date();

            content.innerHTML = `
                <div style="margin-bottom: 1rem;">
                    <strong style="color: var(--text);">Sala: ${reserva.salaNombre}</strong>
                </div>
                <div style="margin-bottom: 0.5rem;">
                    <span style="color: var(--text-light);">📅 Fecha: </span>
                    <span style="color: var(--text);">${reserva.fecha}</span>
                </div>
                <div style="margin-bottom: 0.5rem;">
                    <span style="color: var(--text-light);">⏰ Horario: </span>
                    <span style="color: var(--text);">${reserva.horario} - ${endTimeStr}</span>
                </div>
                <div style="margin-bottom: 0.5rem;">
                    <span style="color: var(--text-light);">⏱️ Duración: </span>
                    <span style="color: var(--text);">${reserva.duracion} horas</span>
                </div>
                <div style="margin-top: 1rem; padding-top: 1rem; border-top: 1px solid var(--border);">
                    <p style="color: var(--text-light); font-size: 0.9rem;">
                        <strong style="color: var(--primary);">Podrás hacer otra reserva después de las ${endTimeStr}</strong>
                    </p>
                </div>
            `;

            section.style.display = 'block';
        }

        // Listen for auth state changes
        window.addEventListener('authStateChanged', function (event) {
            console.log('Auth state change event received:', event.detail);
            const { user, isAuthenticated } = event.detail;

            if (isAuthenticated && user) {
                console.log('User authenticated, updating profile...');
                updateProfileInfo();
            } else {
                console.log('User not authenticated, redirecting to login...');
                window.location.href = '/login';
            }
        });

        // Timeout to prevent infinite loading
        let loadingTimeout;

        // Check authentication and update profile
        document.addEventListener('DOMContentLoaded', function () {
            console.log('DOM loaded, initializing profile...');

            // Set timeout to prevent infinite loading
            loadingTimeout = setTimeout(() => {
                console.log('Loading timeout reached, redirecting to login...');
                window.location.href = '/login';
            }, 10000); // 10 seconds timeout

            // Wait for auth to initialize
            const waitForAuth = () => {
                if (window.auth) {
                    console.log('Auth available, checking authentication...');
                    clearTimeout(loadingTimeout); // Clear timeout
                    window.auth.updateUI();

                    // Check if user is authenticated
                    if (window.auth.isAuthenticated()) {
                        console.log('User is authenticated, updating profile...');
                        updateProfileInfo();
                    } else {
                        console.log('User not authenticated, redirecting to login...');
                        window.location.href = '/login';
                    }
                } else {
                    console.log('Auth not ready yet, retrying...');
                    setTimeout(waitForAuth, 500);
                }
            };

            // Start checking after a short delay
            setTimeout(waitForAuth, 1000);
        });
    </script>
</body>

</html>
