<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bookey - Salas de Mentoría</title>
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/rooms.css">
</head>

<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <a href="/" class="logo">Bookey</a>
            <div class="nav-links">
                <a href="/" class="nav-link">Principal</a>
                <a href="/rooms" class="nav-link active">Salas</a>
                <a href="/profile" class="nav-link" id="profileLink" style="display: none;">Perfil</a>
                <a href="/about" class="nav-link">About us</a>
                <div id="userInfo"></div>
            </div>
        </div>

        <!-- Hero Section -->
        <div class="hero">
            <h1 class="hero-title">Salas de Mentoría</h1>
            <p class="hero-subtitle">Espacios diseñados para el crecimiento académico y la colaboración</p>
        </div>

        <!-- Mis Reservas Activas -->
        <div class="my-reservations" id="myReservations" style="display: none;">
            <h2 class="my-reservations-title">Mis Reservas Activas</h2>
            <div id="reservasActivasContainer">
                <!-- Las reservas activas se cargarán aquí -->
            </div>
        </div>

        <!-- Rooms List -->
        <div class="rooms-list" id="salas-container">
            <!-- Las salas se cargarán dinámicamente aquí -->
            <div class="loading">
                <p>Cargando salas...</p>
            </div>
        </div>
    </div>

    <!-- Include Auth Script -->
    <script src="/js/auth.js"></script>
    <!-- Include API Script -->
    <script src="/js/api.js"></script>

    <script>
        // Simple navigation highlighting (without preventing default)
        document.querySelectorAll('.nav-link').forEach(link => {
            link.addEventListener('click', function () {
                document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
                this.classList.add('active');
            });
        });

        // Cargar salas dinámicamente
        // Cargar salas dinámicamente
        document.addEventListener('DOMContentLoaded', function () {
            // Escuchar cambios en la autenticación
            window.addEventListener('authStateChanged', function (e) {
                const { user, isAuthenticated } = e.detail;
                if (window.auth) {
                    window.auth.updateUI();
                }
                // Reinicializar la página cuando cambia el estado de auth
                initSalasPage();
            });

            // Si ya estamos autenticados al cargar (caso raro pero posible por caché)
            // o si auth.js ya terminó de inicializar antes de este script
            if (window.auth && window.auth.isAuthenticated()) {
                initSalasPage();
            } else {
                // Si no estamos autenticados aún, cargar salas de todas formas (sin info de usuario)
                // Esto permite ver las salas mientras se verifica el login en segundo plano
                initSalasPage();
            }
        });
    </script>
</body>

</html>
