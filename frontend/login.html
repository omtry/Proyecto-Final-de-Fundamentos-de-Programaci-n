<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bookey - Iniciar Sesión</title>
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/auth.css">
</head>

<body>
    <div class="login-wrapper">
        <a href="/" class="back-link">← Volver al inicio</a>

        <div class="login-container">
            <div class="login-header">
                <h1 class="logo-large">Bookey</h1>
                <p class="login-subtitle">Inicia sesión en tu cuenta</p>
            </div>

            <div class="login-card">
            <div id="errorMessage" class="error-message"></div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" id="email" name="email" class="form-input" placeholder="tu@email.com" required>
                </div>

                <div class="form-group">
                    <label for="password" class="form-label">Contraseña</label>
                    <div class="password-input-wrapper">
                        <input type="password" id="password" name="password" class="form-input" placeholder="Tu contraseña"
                            required>
                        <button type="button" class="password-toggle" id="passwordToggle" aria-label="Toggle password visibility">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary-login" id="loginBtn">
                    Iniciar Sesión
                </button>
            </form>

            <div class="divider-text">o</div>

            <button class="btn btn-google" id="googleLoginBtn">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#F59E0B" stroke-width="2" style="margin-right: 0.5rem; flex-shrink: 0;">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
                Continuar con Google
            </button>

                <div class="links">
                    <a href="/register" class="link">¿No tienes cuenta? Regístrate</a><br>
                    <a href="/forgot-password" class="link">¿Olvidaste tu contraseña?</a>
                </div>
            </div>
        </div>
    </div>
    </div>

    <!-- Include Auth Script -->
    <script src="/js/auth.js"></script>

    <script>
        // Handle form submission
        document.getElementById('loginForm').addEventListener('submit', async function (e) {
            e.preventDefault();

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const loginBtn = document.getElementById('loginBtn');
            const errorMessage = document.getElementById('errorMessage');

            // Validate
            if (!email || !password) {
                showError('Por favor completa todos los campos');
                return;
            }

            // Disable button
            loginBtn.disabled = true;
            loginBtn.textContent = 'Iniciando sesión...';
            errorMessage.style.display = 'none';

            try {
                // Use existing auth function
                const success = await window.auth.loginWithEmail(email, password);

                if (success) {
                    // Redirect will be handled by auth.js
                    window.location.href = '/';
                } else {
                    showError('Credenciales incorrectas. Por favor, intenta de nuevo.');
                }
            } catch (error) {
                // Mostrar el mensaje de error traducido
                const errorMessage = error.message || 'Error al iniciar sesión. Por favor, intenta de nuevo.';
                showError(errorMessage);
            } finally {
                loginBtn.disabled = false;
                loginBtn.textContent = 'Iniciar Sesión';
            }
        });

        // Handle Google login
        document.getElementById('googleLoginBtn').addEventListener('click', async function () {
            const btn = this;
            btn.disabled = true;
            const lockIcon = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#F59E0B" stroke-width="2" style="margin-right: 0.5rem; flex-shrink: 0;"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>';
            btn.innerHTML = lockIcon + 'Conectando...';

            try {
                const success = await window.auth.loginWithGoogle();
                if (success) {
                    window.location.href = '/';
                } else {
                    showError('Error al iniciar sesión con Google');
                }
            } catch (error) {
                showError('Error al iniciar sesión con Google: ' + error.message);
            } finally {
                btn.disabled = false;
                btn.innerHTML = lockIcon + 'Continuar con Google';
            }
        });


        // Show error message
        function showError(message) {
            const errorMessage = document.getElementById('errorMessage');
            errorMessage.textContent = message;
            errorMessage.style.display = 'block';
        }

        // Password visibility toggle
        document.getElementById('passwordToggle').addEventListener('click', function () {
            const passwordInput = document.getElementById('password');
            const toggle = this;
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggle.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>';
            } else {
                passwordInput.type = 'password';
                toggle.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>';
            }
        });

        // Check if already authenticated
        document.addEventListener('DOMContentLoaded', function () {
            setTimeout(() => {
                if (window.auth && window.auth.isAuthenticated()) {
                    window.location.href = '/';
                }
            }, 1000);
        });
    </script>
</body>

</html>
